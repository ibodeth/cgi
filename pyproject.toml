[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cine-master"
version = "1.0.0"
description = "CGI/render delivery mastering: 35mm grain, de-banding and clean bitstreams through a single FFmpeg graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cine-master = "cinemaster.cli:app"

[tool.setuptools]
packages = ["cinemaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
